<!DOCTYPE html><html lang=en><script type=importmap>{"imports":{"1dRjC":"./coil.f0e93404.ply","2exwy":"./scalp.e2cbd793.ply","3GHgq":"./coil.e3881db9.ply","6QuNe":"./scalp.1e15f9bb.ply","89M77":"./montecarlo.4a27dd5a.json","8N77H":"./scalp.548d5203.ply","c4fsm":"./scalp.5b855960.ply","cbYcQ":"./montecarlo.f73cb57e.json","d2X5r":"./coil.1bab5198.ply","dylbV":"./coil.297fffff.ply","fDBk2":"./montecarlo.1252f6c8.json","fKTh0":"./scalp.f4b8013b.ply","flBx5":"./montecarlo.58f48c2a.json","gtxom":"./coil.654151cf.ply","iWzNz":"./montecarlo.4b5beefb.json","igRIO":"./coil.7090f20c.ply","jAA9C":"./scalp.48f73331.ply","jEQEK":"./montecarlo.a7e88847.json"}}</script><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>TMS-Nav viewer</title><meta name=description content="Where an EEG 10-20 cap puts a TMS coil compared with MRI guided neuronavigation, on six sample heads."><link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='8' r='3.5' fill='none' stroke='%231f77b4' stroke-width='1.6'/%3E%3Ccircle cx='11' cy='8' r='3.5' fill='none' stroke='%231f77b4' stroke-width='1.6'/%3E%3C/svg%3E"><link rel=stylesheet href=viewer.dfa54a65.css><body>
    <div id=app>
      <aside id=ui class=panel aria-label="viewer controls">
        <h1>TMS Navigation</h1>
        <div class=subject>
          <label for=subject-select>subject</label>
          <select id=subject-select></select>
        </div>

        <fieldset>
          <legend>layers</legend>
          <label><input type=checkbox id=toggle-scalp autocomplete=off checked> scalp <span class="sw-scalp swatch" aria-hidden=true></span></label>
          <label><input type=checkbox id=toggle-coil autocomplete=off checked> coil <span class="sw-coil swatch" aria-hidden=true></span></label>
          <label><input type=checkbox id=toggle-targets autocomplete=off checked> targets <span class="sw-target swatch" aria-hidden=true></span></label>
          <label><input type=checkbox id=toggle-landmarks autocomplete=off checked> EEG landmarks <span class="sw-landmark swatch" aria-hidden=true></span></label>
          <label><input type=checkbox id=toggle-mc autocomplete=off checked> monte carlo <span class="sw-mc swatch" aria-hidden=true><i></i><i></i><i></i></span></label>
        </fieldset>

        <div class=row>
          <label for=opacity>scalp opacity</label>
          <input type=range id=opacity min=0 max=100 value=85>
        </div>

        <div class=row>
          <label for=coil-opacity>coil opacity</label>
          <input type=range id=coil-opacity min=0 max=100 value=35>
        </div>

        <div class=row>
          <label for=variability>target variability <span id=variability-val>2.5 mm</span></label>
          <input type=range id=variability min=1 max=10 step=0.5 value=2.5>
        </div>

        <fieldset id=mc-panel>
          <legend>monte carlo</legend>
          <div class=row>
            <label for=mc-scale>exaggerate <span id=mc-scale-val>x5</span></label>
            <input type=range id=mc-scale min=1 max=10 step=1 value=5>
          </div>
          <label><input type=checkbox id=mc-samples autocomplete=off checked> samples</label>
          <label><input type=checkbox id=mc-mean autocomplete=off checked> mean</label>
          <label><input type=checkbox id=mc-ellipsoid autocomplete=off checked> 95% ellipsoid</label>
          <div class=row>
            <button id=mc-resample type=button title="draw a fresh random set">resample</button>
            <span class=hint id=mc-draw></span>
          </div>
          <button class=disclose id=mc-note-head type=button aria-expanded=false>
            <span class=chev></span>settings
          </button>
          <div class=hint id=mc-note hidden></div>
        </fieldset>

        <div class=hint>drag to rotate, scroll to zoom, click a marker</div>
        <div class=credit>
          Sample heads are the SimNIBS example data: ernie (T1, CC BY-NC 4.0) and the
          group dataset (T2 to T6, ODC-PDDL, OpenfMRI ds000171).
        </div>
      </aside>

      <main id=stage>
        <canvas id=c></canvas>

        <button type=button class="edge-left edge-tab" data-panel=ui aria-controls=ui aria-expanded=true aria-label="Hide controls">
          <span class=edge-chev aria-hidden=true></span>
        </button>
        <button type=button class="edge-right edge-tab" data-panel=dist aria-controls=dist aria-expanded=true aria-label="Hide metrics">
          <span class=edge-chev aria-hidden=true></span>
        </button>

        <div id=info class=hidden></div>

        <div id=zoom>
          <button id=zoom-out type=button title="zoom out">−</button>
          <input type=range id=zoom-slider min=10 max=250 step=1 value=100 aria-label=zoom>
          <button id=zoom-in type=button title="zoom in">+</button>
          <button id=zoom-val type=button title="reset to fit">100%</button>
        </div>

        <a id=open-full class=open-full target=_blank rel=noopener hidden>Open full viewer</a>
      </main>

      <aside id=dist class=panel aria-label="aim 1 metrics">
        <h2>Aim 1 Metrics</h2>
        <div class=seg>
          <button type=button data-metric=miss class=on title="distance from a placement to the MRI target">displacement</button>
          <button type=button data-metric=pair title="distance between two placements of the same target">repeat</button>
          <button type=button data-metric=tilt title="tilt of the coil face that follows from the mark being off">tilt</button>
          <button type=button data-metric=orient title="total coil orientation difference, tilt plus handle yaw">orientation</button>
        </div>

        <div class=col-head>
          <span id=subject-label>this head</span>
          <span class=c-num>mean</span>
          <span class=c-num>p95</span>
        </div>
        <div id=dist-charts></div>

        <button class="disclose section" id=group-head type=button aria-expanded=false aria-controls=group>
          <span class=chev aria-hidden=true></span><span id=group-title>Brainsight results</span>
        </button>
        <div id=group hidden></div>
      </aside>
    </div>

    <div id=fatal role=alert hidden></div>

    <script type=module src=viewer.081ddc5c.js></script>
