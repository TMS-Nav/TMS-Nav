<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TMS-Nav viewer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="ui">
      <h1>TMS-Nav</h1>
      <div class="subject">
        <label for="subject-select">subject</label>
        <select id="subject-select"></select>
      </div>

      <fieldset>
        <legend>layers</legend>
        <label><input type="checkbox" id="toggle-scalp" autocomplete="off" checked /> scalp</label>
        <label><input type="checkbox" id="toggle-brain" autocomplete="off" /> brain</label>
        <label><input type="checkbox" id="toggle-coil" autocomplete="off" checked /> coil</label>
        <label><input type="checkbox" id="toggle-targets" autocomplete="off" checked /> targets</label>
        <label><input type="checkbox" id="toggle-landmarks" autocomplete="off" checked /> landmarks</label>
        <label><input type="checkbox" id="toggle-mc" autocomplete="off" checked /> monte carlo</label>
      </fieldset>

      <div class="row">
        <label for="opacity">scalp opacity</label>
        <input type="range" id="opacity" min="0" max="100" value="85" />
      </div>

      <div class="row">
        <label for="variability">target variability <span id="variability-val">2.5 mm</span></label>
        <input type="range" id="variability" min="1" max="10" step="0.5" value="2.5" />
      </div>

      <fieldset id="mc-panel">
        <legend>monte carlo</legend>
        <div class="row">
          <label for="mc-scale">exaggerate <span id="mc-scale-val">x5</span></label>
          <input type="range" id="mc-scale" min="1" max="10" step="1" value="5" />
        </div>
        <label><input type="checkbox" id="mc-samples" autocomplete="off" checked /> samples</label>
        <label><input type="checkbox" id="mc-mean" autocomplete="off" checked /> mean</label>
        <label><input type="checkbox" id="mc-ellipsoid" autocomplete="off" checked /> 95% ellipsoid</label>
        <label><input type="checkbox" id="mc-dist" autocomplete="off" checked /> distance histograms</label>
        <div class="row">
          <button id="mc-resample" type="button" title="draw a fresh random set">resample</button>
          <span class="hint" id="mc-draw"></span>
        </div>
        <div class="hint" id="mc-note">...</div>
      </fieldset>

      <div class="key">
        <div><span class="swatch" style="background:#111"></span> stimulation target</div>
        <div><span class="swatch" style="background:#f2c14e"></span> EEG landmark</div>
        <div><span class="swatch" style="background:#1f77b4"></span> coil</div>
      </div>

      <div class="hint">drag to rotate, scroll to zoom, click a marker</div>
    </div>

    <div id="info" class="hidden"></div>

    <div id="dist">
      <div class="dist-head">
        <h2>placement error</h2>
        <div class="seg">
          <button type="button" data-metric="miss" class="on">to MRI target</button>
          <button type="button" data-metric="pair">between two placements</button>
        </div>
      </div>
      <div id="dist-charts"></div>
      <div class="hint">
        every simulated cap. solid line mean, dotted line 95th percentile, ticks are
        the draws on screen. hover a bar for its count.
      </div>
    </div>

    <div id="zoom">
      <button id="zoom-out" type="button" title="zoom out">&minus;</button>
      <input type="range" id="zoom-slider" min="10" max="250" step="1" value="100" />
      <button id="zoom-in" type="button" title="zoom in">+</button>
      <button id="zoom-val" type="button" title="reset to fit">100%</button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
